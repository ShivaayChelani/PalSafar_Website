<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error | PalSafar</title>
  <meta name="description" content="An internal server error occurred on PalSafar.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/brand/logo-icon.png">
  <style>
    body { background-color: #faf7ee; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
    .error-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
    .error-container h1 { font-size: 6rem; color: #001a3f; margin-bottom: 1rem; font-family: "Playfair Display", serif; }
    .error-container p { font-size: 1.2rem; color: #5c6b82; margin-bottom: 2rem; font-family: "Inter", sans-serif; }
    .btn-primary { display: inline-block; padding: 12px 24px; background: #001a3f; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; font-family: "Inter", sans-serif; }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>500</h1>
    <p>Sorry, something went wrong on our end. Please try again later.</p>
    <a href="/" class="btn-primary">Return to Homepage</a>
  </div>
</body>
</html>
