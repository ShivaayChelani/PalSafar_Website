<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FDF8F1" />
  <meta name="description" content="Open this PalSafar Reel in the PalSafar app." />
  <meta property="og:title" content="Open this Reel in PalSafar" />
  <meta property="og:description" content="Open this PalSafar Reel in the PalSafar app." />
  <meta name="ios-store-url" content="" />
  <link rel="canonical" />
  <meta property="og:url" content="" />
  <title>Open this Reel in PalSafar</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #14213d; background: #fdf8f1; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    main { max-width: 34rem; }
    .brand { margin-bottom: 12px; color: #9c7c31; font-size: 0.875rem; letter-spacing: 0.2em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 5vw, 2.75rem); }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="brand">PalSafar</div>
    <h1 id="title">Opening PalSafar…</h1>
    <p id="message">Taking you to the right place for this Reel.</p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const reelId = params.get("reelId");
      const safeId = /^[A-Za-z0-9_-]+$/.test(reelId || "");
      const message = document.getElementById("message");
      const title = document.getElementById("title");

      if (!safeId) {
        title.textContent = "Reel link unavailable";
        message.textContent = "This PalSafar Reel link is invalid.";
        return;
      }

      const canonicalUrl = `https://palsafar.in/reel/${encodeURIComponent(reelId)}`;
      document.querySelector('link[rel="canonical"]').href = canonicalUrl;
      document.querySelector('meta[property="og:url"]')?.setAttribute("content", canonicalUrl);
      document.title = `Open this Reel in PalSafar`;

      const userAgent = navigator.userAgent || "";
      const isAndroid = /Android/i.test(userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const androidStoreUrl = "https://play.google.com/store/apps/details?id=com.palsasafar";
      const iosStoreUrl = document.querySelector('meta[name="ios-store-url"]')?.content.trim() || "";

      if (isAndroid) {
        window.location.replace(androidStoreUrl);
        return;
      }

      if (isIOS && /^https:\/\/apps\.apple\.com\//i.test(iosStoreUrl)) {
        window.location.replace(iosStoreUrl);
        return;
      }

      title.textContent = "Open this Reel in PalSafar";
      message.textContent = isIOS
        ? "The PalSafar App Store listing is not configured yet."
        : "Open this link on an Android or iOS device to continue to PalSafar.";
    })();
  </script>
</body>
</html>
